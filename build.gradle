plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.cryschan'
version = '0.0.1-SNAPSHOT'
description = 'BE-Repository'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring AI BOM (버전 일괄 관리)
    implementation platform('org.springframework.ai:spring-ai-bom:1.1.0')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Spring AI - OpenAI (버전은 BOM에서 관리)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // HTML parsing
    implementation 'org.jsoup:jsoup:1.18.3'

    // Swagger/OpenAPI 3.0 - 간단한 설정 (Spring Boot 3.5 호환 버전)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    // Swagger/OpenAPI 3.0
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    // Swagger Core 최신 버전 강제 (springdoc 2.8.4와 호환)
    implementation 'io.swagger.core.v3:swagger-core-jakarta:2.2.30'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.30'
    implementation 'io.swagger.core.v3:swagger-models-jakarta:2.2.30'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // AWS SDK v2
    implementation platform('software.amazon.awssdk:bom:2.25.0')
    implementation 'software.amazon.awssdk:s3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Optimize JAR generation for Docker builds
tasks.named('bootJar') {
    enabled = true
    archiveFileName = "${project.name}-${project.version}.jar"
}

tasks.named('jar') {
    enabled = false  // Prevent plain.jar generation
}
