spring:
  application:
    name: be-repository
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:test_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # AI Configuration (Spring AI + OpenAI)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-3.5-turbo}
          temperature: ${OPENAI_TEMPERATURE:0.7}

server:
  port: ${SERVER_PORT:8080}

# Swagger 간단 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.github.cryschan.berepository: ${LOG_LEVEL:DEBUG}

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production}  # 환경변수에서 읽기
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}  # 1시간 (밀리초)
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7일 (밀리초)

# Initial Data Configuration
init:
  admin:
    email: ${INIT_ADMIN_EMAIL:admin@repository.com}
    password: ${INIT_ADMIN_PASSWORD:1234qwer}
    username: ${INIT_ADMIN_USERNAME:System Admin}
    department: ${INIT_ADMIN_DEPARTMENT:Management}
  user:
    email: ${INIT_USER_EMAIL:user@repository.com}
    password: ${INIT_USER_PASSWORD:1234qwer}
    username: ${INIT_USER_USERNAME:Test User}
    department: ${INIT_USER_DEPARTMENT:Development}
